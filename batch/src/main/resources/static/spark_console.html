<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banks 大数据反欺诈控制台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .step-badge { background-color: #0d6efd; color: white; padding: 5px 10px; border-radius: 50%; margin-right: 10px; }
        #console-output { background-color: #212529; color: #00ff00; padding: 15px; border-radius: 5px; height: 300px; overflow-y: auto; font-family: 'Consolas', monospace; }
        .loading { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center mb-4">
        <h1>🚀 Banks 大数据反欺诈控制台</h1>
        <p class="text-muted">Hadoop HDFS 存储 + Spark 本地计算引擎</p>
    </div>

    <div class="row">
        <div class="col-md-6">

            <div class="card">
                <div class="card-header bg-white">
                    <span class="step-badge">1</span> <strong>环境初始化</strong>
                </div>
                <div class="card-body">
                    <p class="small text-muted">首次运行请点击初始化，连接本地 Hadoop 集群。</p>
                    <button class="btn btn-outline-primary w-100" onclick="initSpark()">🔗 初始化 Spark Session</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-white">
                    <span class="step-badge">2</span> <strong>数据上传 (HDFS)</strong>
                </div>
                <div class="card-body">
                    <div class="alert alert-warning small p-2">
                        ⚠️ <strong>注意：</strong> 上传的文件名必须严格对应：<br>
                        1. <code>accounts.csv</code> (账户表)<br>
                        2. <code>login_records.csv</code> (登录表)<br>
                        3. <code>transfer_records.csv</code> (转账表)
                    </div>

                    <div class="mb-3">
                        <label class="form-label">选择 CSV 文件上传</label>
                        <div class="input-group">
                            <input type="file" class="form-control" id="fileInput">
                            <button class="btn btn-success" type="button" onclick="uploadFile()">📤 上传</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-white">
                    <span class="step-badge">3</span> <strong>执行 Spark 分析</strong>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">受害人规则 (Victim Rule)</label>
                        <input type="text" class="form-control" id="victimRule" value="INDICATOR_A > 0">
                        <div class="form-text">默认：寻找快进快出的大额交易</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">可疑分子规则 (Suspect Rule)</label>
                        <input type="text" class="form-control" id="suspectRule" value="INDICATOR_B > 0">
                        <div class="form-text">默认：寻找登录后立即大额转账</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">时间窗口 (天)</label>
                        <input type="number" class="form-control" id="timeWindow" value="30">
                    </div>
                    <button class="btn btn-danger w-100" onclick="runAnalysis()" id="analyzeBtn">
                        <span class="spinner-border spinner-border-sm loading" role="status" aria-hidden="true"></span>
                        ⚡ 开始大数据分析
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <strong>📜 控制台日志</strong>
                    <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">清空</button>
                </div>
                <div class="card-body bg-dark p-0">
                    <div id="console-output">
                        <div>> 等待操作...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api/spark'; // 对应 Controller 的 RequestMapping

    function log(message, type = 'info') {
        const consoleDiv = document.getElementById('console-output');
        const time = new Date().toLocaleTimeString();
        let color = '#00ff00'; // 默认绿色
        if (type === 'error') color = '#ff4444';
        if (type === 'warn') color = '#ffbb33';

        const html = `<div style="color:${color}; margin-bottom: 5px;">[${time}] ${message}</div>`;
        consoleDiv.innerHTML += html;
        consoleDiv.scrollTop = consoleDiv.scrollHeight; // 自动滚动到底部
    }

    function clearLog() {
        document.getElementById('console-output').innerHTML = '<div>> 日志已清空</div>';
    }

    // 1. 初始化
    async function initSpark() {
        log("正在连接 Hadoop 集群...", 'warn');
        try {
            const res = await fetch(`${API_BASE}/init`);
            const text = await res.text();
            if (res.ok) {
                log("✅ " + text);
            } else {
                log("❌ 初始化失败: " + text, 'error');
            }
        } catch (e) {
            log("❌ 请求异常: " + e.message, 'error');
        }
    }

    // 2. 上传文件
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert("请先选择一个文件！");
            return;
        }

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('file', file);

        log(`正在上传文件: ${file.name} 到 HDFS...`, 'warn');

        try {
            const res = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json(); // 这里对应 Controller 返回的 Map JSON

            if (data.success) {
                log(`✅ 上传成功!`, 'info');
                log(`📂 HDFS路径: ${data.hdfsPath}`);
            } else {
                log(`❌ 上传失败: ${data.message}`, 'error');
            }
        } catch (e) {
            log("❌ 网络或服务器异常: " + e.message, 'error');
        }
    }

    // 3. 执行分析
    async function runAnalysis() {
        const btn = document.getElementById('analyzeBtn');
        const loader = document.querySelector('.loading');

        // 锁定按钮
        btn.disabled = true;
        loader.style.display = 'inline-block';
        log("正在提交 Spark 任务，请稍候...", 'warn');

        const victimRule = document.getElementById('victimRule').value;
        const suspectRule = document.getElementById('suspectRule').value;
        const timeWindow = document.getElementById('timeWindow').value;

        // 构建 URL 参数
        const params = new URLSearchParams({
            victimRule: victimRule,
            suspectRule: suspectRule,
            timeWindow: timeWindow
        });

        try {
            const res = await fetch(`${API_BASE}/analyze?${params.toString()}`, {
                method: 'POST'
            });
            const data = await res.json();

            if (res.ok) {
                log("✅ 分析完成!", 'info');
                // 格式化展示 JSON 结果
                log(JSON.stringify(data, null, 2).replace(/\n/g, "<br>").replace(/ /g, "&nbsp;"));
            } else {
                log(`❌ 任务失败: ${data.message || JSON.stringify(data)}`, 'error');
                if (data.hint) log(`💡 提示: ${data.hint}`, 'warn');
            }
        } catch (e) {
            log("❌ 任务执行异常: " + e.message, 'error');
        } finally {
            // 解锁按钮
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
