name: Build and configuration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, batch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp package
        working-directory: ${{ matrix.module }}
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend/scripts/data_generation -p 'test_*.py'
      - run: |
          docker compose -f backend/deploy/compose.yml config --quiet
          docker compose -f backend/deploy/compose_full.yml config --quiet
        env:
          DB_PASSWORD: configuration-test-only
