# ========================================
# Spark集群模式配置示例
# ========================================
# 使用说明：将以下配置添加到 src/main/resources/application.properties

# ========================================
# Spark集群连接配置
# ========================================
# Spark Master地址（必须修改为实际Master节点IP）
spark.master=spark://192.168.1.100:7077

# 应用程序名称
spark.app.name=BankFraudAnalysis

# ========================================
# Spark资源配置
# ========================================
# Driver内存（运行在应用服务器上）
spark.driver.memory=4g

# Executor内存（运行在Worker节点上）
spark.executor.memory=8g

# 每个Executor使用的CPU核心数
spark.executor.cores=4

# Executor实例数量（根据Worker节点数量调整）
spark.executor.instances=3

# ========================================
# Spark性能优化配置
# ========================================
# SQL Shuffle分区数（根据数据量调整，建议：数据量GB * 2）
spark.sql.shuffle.partitions=200

# 默认并行度（建议：集群总CPU核心数 * 2-3）
spark.default.parallelism=24

# 启用自适应查询执行（Spark 3.0+）
spark.sql.adaptive.enabled=true

# 自适应合并分区
spark.sql.adaptive.coalescePartitions.enabled=true

# 序列化方式（Kryo性能更好）
spark.serializer=org.apache.spark.serializer.KryoSerializer

# ========================================
# Spark事件日志配置（可选，用于历史服务器）
# ========================================
# 启用事件日志
spark.eventLog.enabled=true

# 事件日志目录（需要提前创建）
spark.eventLog.dir=hdfs://namenode:9000/spark-logs
# 或使用本地目录：file:///opt/spark/logs

# ========================================
# Spark动态资源分配（可选）
# ========================================
# 启用动态资源分配
# spark.dynamicAllocation.enabled=true
# spark.dynamicAllocation.minExecutors=1
# spark.dynamicAllocation.maxExecutors=10
# spark.dynamicAllocation.initialExecutors=2

# ========================================
# Spark网络配置
# ========================================
# 网络超时时间（秒）
spark.network.timeout=300s

# RPC请求超时时间
spark.rpc.askTimeout=300s

# ========================================
# 数据本地性配置
# ========================================
# 数据本地性等待时间
spark.locality.wait=3s

# ========================================
# Spark UI配置
# ========================================
# Spark Web UI端口（默认4040）
spark.ui.port=4040

# 保留的已完成任务数
spark.ui.retainedJobs=1000
spark.ui.retainedStages=1000

# ========================================
# 其他优化配置
# ========================================
# 广播变量阈值（10MB）
spark.sql.autoBroadcastJoinThreshold=10485760

# 压缩方式
spark.io.compression.codec=snappy

# ========================================
# 配置说明
# ========================================
# 1. spark.master 必须修改为实际的Spark Master地址
# 2. spark.executor.memory 根据Worker节点内存调整
#    - 推荐：Worker内存的70-80%
#    - 例如：Worker 32GB内存，可设置 20g-25g
# 3. spark.executor.instances 根据Worker节点数量调整
#    - 建议：每个Worker运行2-3个Executor
#    - 例如：3个Worker节点，可设置 6-9 个Executor
# 4. spark.sql.shuffle.partitions 根据数据量调整
#    - 小数据（<1GB）：100-200
#    - 中等数据（1-10GB）：200-500
#    - 大数据（>10GB）：500-1000
# 5. 性能调优建议：
#    - 监控Spark UI，查看任务执行情况
#    - 根据实际情况调整分区数和并行度
#    - 注意数据倾斜问题，必要时重新分区

# ========================================
# 常见问题排查
# ========================================
# 问题1：连接Master失败
# 解决：检查Master地址、端口、防火墙
#
# 问题2：Executor内存不足
# 解决：增加spark.executor.memory或减少并行度
#
# 问题3：任务执行慢
# 解决：增加分区数、调整Executor数量、检查数据倾斜





