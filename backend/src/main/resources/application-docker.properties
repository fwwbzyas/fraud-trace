# Docker环境配置
spring.application.name=banks

# 数据库配置 - Docker环境
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/banksys}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JSON配置
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# 分页配置
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# 线程池配置
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=1000

# Redis配置 - Docker环境
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# 服务器配置
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Apache Spark配置
spark.app.name=FraudDetectionAnalysis
spark.master=local[*]
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.sql.warehouse.dir=./spark-warehouse

# JVM参数解决Java 17模块兼容性问题
spring.jpa.defer-datasource-initialization=true

# 日志配置
logging.level.com.example.banks=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.spark=WARN
logging.level.org.hibernate.SQL=DEBUG

# 健康检查
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized