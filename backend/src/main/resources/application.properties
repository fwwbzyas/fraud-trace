spring.application.name=banks

# ==========================================
# 1. ????? (????)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banksys}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ????????
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA??
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ??Java 17???????
spring.jpa.defer-datasource-initialization=true

# ==========================================
# 2. ?????? (????)
# ==========================================
# JSON??
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ????
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ?????
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=1000

# Redis??
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ?????
server.port=8080
server.servlet.context-path=/api 

# ==========================================
# 3. Hadoop HDFS ?? (? ???? ?)
# ==========================================
# ?? ??????? Hadoop NameNode ??? IP ??? (??? 8020 ? 9000)
hadoop.fs.defaultFS=${HDFS_URL:hdfs://localhost:8020}

# HDFS ???? (??? root ? hadoop ?????? Permission Denied)
hadoop.user.name=${HADOOP_USER_NAME:root}

# HDFS ????????????
spark.hdfs.base.dir=/user/banks/input

# ==========================================
# 4. Apache Spark ?? (???? + HDFS)
# ==========================================
spark.app.name=FraudDetectionAnalysis
# ? ?? local[*]??????? CPU ??????
spark.master=local[*]

# ? ??????
spark.serializer=org.apache.spark.serializer.KryoSerializer

# ? Warehouse ???? HDFS (?? Spark SQL ??????? Hadoop ?)
spark.sql.warehouse.dir=${hadoop.fs.defaultFS}/user/banks/spark-warehouse

# Spark SQL ??
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true

# ==========================================
# 5. ?? Spark ????
# ==========================================
integrated.spark.enabled=true
integrated.spark.default.engine=true
analysis.engine.strategy=ALWAYS_SPARK
analysis.engine.default=INTEGRATED_SPARK

# ==========================================
# ? ???????? (??? 1GB)
# ==========================================
# ?????????
spring.servlet.multipart.max-file-size=1024MB

# ????????? (?????????)
spring.servlet.multipart.max-request-size=1024MB


# ==========================================
# 6. ????
# ==========================================
logging.level.com.example.banks=INFO
logging.level.org.springframework.web=INFO
# ?? Spark ?????
logging.level.org.apache.spark=WARN
logging.level.org.apache.hadoop=WARN