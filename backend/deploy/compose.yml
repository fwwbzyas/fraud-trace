services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: banksys-postgres
    environment:
      POSTGRES_DB: banksys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - banksys-network

  # Spring Boot 后端
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: banksys-backend
    environment:
      # 数据库连接
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banksys
      SPRING_DATASOURCE_USERNAME: postgres
      DB_URL: jdbc:postgresql://postgres:5432/banksys
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      HDFS_URL: ${HDFS_URL:-hdfs://host.docker.internal:8020}
      # JVM 参数
      JAVA_OPTS: -Xms2g -Xmx4g -XX:+UseG1GC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - banksys-network
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G

  # Vue 前端
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_DIFY_ENABLED: ${VITE_DIFY_ENABLED:-false}
        VITE_DIFY_BASE_URL: ${VITE_DIFY_BASE_URL:-}
        VITE_DIFY_EMBED_TOKEN: ${VITE_DIFY_EMBED_TOKEN:-}
    container_name: banksys-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - banksys-network

volumes:
  postgres_data:
    driver: local

networks:
  banksys-network:
    driver: bridge
